
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087bd5">
<title>أثر الأنبياء | موسوعة الطفل المسلم</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap');
:root{--blue:#087bd5;--navy:#0754a2;--gold:#ffc928;--green:#26b85e;--paper:#fff9e9}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:linear-gradient(180deg,#74d8ff,#d8f7ff 42%,#b8ed9b);color:#17324e;min-height:100vh}
button,input{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:auto;padding:12px}
.hero{position:relative;overflow:hidden;border:5px solid #fff;border-radius:28px;background:linear-gradient(115deg,#087bd5,#26b8df 48%,#58c66d);box-shadow:0 7px 0 #1474aa;padding:18px;color:white;display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:12px;min-height:190px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:#ffffff20;width:180px;height:180px}
.hero:before{top:-90px;right:20%}.hero:after{bottom:-120px;left:10%}
.profile,.brand,.mascot{position:relative;z-index:1}
.profile{background:#0756a9;border:3px solid #ffe18a;border-radius:24px;padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 0 #063c7b}
.avatar{width:76px;height:76px;border-radius:50%;background:linear-gradient(#ffe5a7,#ffad56);border:4px solid white;display:grid;place-items:center;font-size:45px;flex-shrink:0}
.profile h3{margin:0;font-size:20px}.profile p{margin:3px 0;font-size:13px}
.brand{text-align:center;background:linear-gradient(#b97827,#713b10);border:5px solid #f5cf72;border-radius:30px;padding:10px;box-shadow:inset 0 0 0 3px #ffe9a7,0 6px 0 #744117}
.brand h1{font-size:clamp(28px,5vw,54px);margin:0;color:#fff3c6;text-shadow:2px 4px 2px #48220b}
.brand p{background:#fff4d5;color:#422a13;border-radius:30px;margin:8px auto 0;padding:5px 12px;font-weight:900;width:max-content;max-width:100%}
.mascot{text-align:center;font-size:90px}
.speech{font-size:15px;font-weight:900;background:white;color:#17324e;padding:9px;border-radius:22px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:14px;margin-top:16px}
.main-panel{background:#fff8df;border:5px solid white;border-radius:28px;padding:12px;box-shadow:0 6px 0 #91bd68}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.tile{border:3px solid #ffffff;border-radius:23px;min-height:145px;padding:10px 5px;color:white;font-weight:900;text-align:center;box-shadow:0 5px 0 #17324e55,inset 0 0 0 2px #ffffff40;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;transition:.15s}
.tile:active{transform:translateY(4px);box-shadow:0 1px 0 #17324e55}
.tile .emoji{font-size:48px;filter:drop-shadow(1px 3px 1px #3335)}
.tile span:last-child{font-size:16px;line-height:1.5}
.c1{background:linear-gradient(145deg,#62caff,#0867c8)}.c2{background:linear-gradient(145deg,#d98cff,#7427c9)}.c3{background:linear-gradient(145deg,#8fe76d,#159647)}.c4{background:linear-gradient(145deg,#ffd36c,#e87913)}.c5{background:linear-gradient(145deg,#65c5ff,#1643b4)}.c6{background:linear-gradient(145deg,#8be08b,#168d58)}
.side{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--paper);border:4px solid white;border-radius:25px;padding:13px;box-shadow:0 5px 0 #d2a95d}
.panel h3{text-align:center;margin:0 0 10px;font-size:19px;color:#74400d}
.stat{display:flex;align-items:center;gap:10px;border-bottom:1px solid #e4cda3;padding:8px 2px}
.stat b{font-size:25px}.stat span{font-size:27px}
.progress{height:15px;background:#e5d2a8;border-radius:20px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#40d45e,#a5ed42);border-radius:20px}
.lesson{background:linear-gradient(#ffe879,#ffb928)}
.lesson .picture{font-size:55px;text-align:center}
.lesson button,.action{border:0;border-radius:25px;background:linear-gradient(#ffb32d,#e76a08);color:white;font-weight:900;padding:10px 18px;box-shadow:0 4px 0 #a94c05}
.bottom{display:flex;justify-content:space-around;gap:5px;background:linear-gradient(#1599ef,#0755ac);border:4px solid white;border-radius:25px;margin-top:15px;padding:8px;color:white;box-shadow:0 5px 0 #06417c}
.bottom button{background:transparent;border:0;color:white;font-weight:900;display:flex;flex-direction:column;align-items:center;min-width:65px}
.bottom span{font-size:26px}
.challenge{margin-top:14px;background:linear-gradient(100deg,#e8baff,#fff1ff,#c8a0ff);border:4px solid white;border-radius:25px;padding:12px;text-align:center;font-weight:900}
.page{display:none;background:#fffaf0;border:5px solid white;border-radius:25px;padding:18px;margin-top:15px;min-height:350px;box-shadow:0 5px 0 #91bd68}
.page.active{display:block}
.page h2{color:#075da9;margin-top:0}
.back{background:#087bd5;color:white;border:0;border-radius:18px;padding:8px 18px;font-weight:900}
.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-top:15px}
.item{background:white;border:2px solid #d9e8ff;border-radius:16px;padding:13px;text-align:center;font-weight:800}
.item button{margin-top:8px;border:0;border-radius:12px;background:#e5f4ff;padding:7px;color:#075da9;font-weight:800}
.search{width:100%;padding:13px;border:2px solid #9acdf4;border-radius:15px;margin:10px 0}
.child-choice{display:flex;gap:8px;flex-wrap:wrap}
.child-choice button{border:2px solid white;border-radius:20px;background:#087bd5;color:white;padding:8px 18px;font-weight:900}
.notice{background:#e7f8e9;border-radius:14px;padding:12px;margin:10px 0}
footer{text-align:center;padding:18px;font-weight:800;color:#27613c}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr 2fr}.mascot{display:none}}
@media(max-width:520px){.app{padding:6px}.hero{grid-template-columns:1fr 1fr;padding:9px;min-height:145px}.brand{grid-column:1/-1;grid-row:1}.brand h1{font-size:30px}.profile{grid-column:1/-1;grid-row:2}.mascot{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.tile{min-height:112px;border-radius:17px}.tile .emoji{font-size:35px}.tile span:last-child{font-size:12px}.side{grid-template-columns:1fr 1fr}.panel{padding:9px}.panel h3{font-size:15px}.bottom{padding:6px 2px}.bottom button{font-size:11px;min-width:0}.bottom span{font-size:21px}}
</style>
</head>
<body>
<div class="app">
<header class="hero">
  <div class="profile">
    <div class="avatar" id="avatar">👦</div>
    <div><h3 id="childName">إياد</h3><p>⭐ <b id="stars">0</b></p><p id="level">المستوى البرونزي</p></div>
  </div>
  <div class="brand"><h1>أثر الأنبياء</h1><p>موسوعة إسلامية تعليمية للأطفال</p>📖</div>
  <div class="mascot">👧<div class="speech">معًا نكتشف قصص الأنبياء ونتعلم القيم الجميلة 💗</div></div>
</header>

<div class="child-choice" style="margin-top:12px">
  <button onclick="chooseChild('eyad')">👦 إياد</button>
  <button onclick="chooseChild('mayan')">👧 مايان</button>
  <button onclick="chooseChild('layan')">👶 ليان</button>
</div>

<div class="layout" id="homeLayout">
 <main class="main-panel">
  <div class="grid" id="mainGrid"></div>
 </main>
 <aside class="side">
  <section class="panel">
   <h3>👑 إحصائيات الطفل</h3>
   <div class="stat"><span>⭐</span><div><b id="statStars">0</b><br>نجمة</div></div>
   <div class="stat"><span>🏆</span><div><b id="achievements">0</b><br>إنجاز</div></div>
   <div class="stat"><span>🌟</span><div><b id="percent">0%</b><br>مستوى التقدم</div></div>
   <div class="progress"><i id="progressBar"></i></div>
  </section>
  <section class="panel lesson">
   <h3>📚 آخر درس</h3><div class="picture">🕌</div>
   <p id="lastLesson">لم تبدأ التعلم بعد</p>
   <button onclick="openLastLesson()">متابعة الدرس ▶</button>
  </section>
 </aside>
</div>

<section class="challenge">
 ⭐ تحدي اليوم ⭐
 <p id="dailyQuestion">ما أول أركان الإسلام؟</p>
 <button class="action" onclick="openSection('quiz')">ابدأ التحدي ▶</button>
</section>

<section class="page" id="contentPage">
 <button class="back" onclick="goHome()">↩ الرئيسية</button>
 <div id="pageContent"></div>
</section>

<nav class="bottom">
 <button onclick="goHome()"><span>🏠</span>الرئيسية</button>
 <button onclick="openSection('library')"><span>❔</span>المساعدة</button>
 <button onclick="openSection('reports')"><span>📊</span>التقارير</button>
 <button onclick="openSection('certificates')"><span>🏆</span>الشهادات</button>
 <button onclick="openSection('about')"><span>ℹ️</span>عن التطبيق</button>
</nav>
<footer>🌷 أثر الأنبياء – نتعلم ونرتقي 🌷</footer>
</div>

<script>
const sections=[
['quran','📖','القرآن الكريم مع المعاني','c1'],
['prophets','🕌','موسوعة الأنبياء (25 نبيًا)','c2'],
['tree','🌳','شجرة الأنبياء','c3'],
['journeys','🐪','رحلات الأنبياء','c4'],
['names','✨','أسماء الله الحسنى','c5'],
['seerah','🕌','السيرة النبوية','c6'],
['prayer','🧎','الوضوء والصلاة','c1'],
['pillars','🕋','أركان الإسلام','c3'],
['duas','🤲','الأذكار والأدعية','c6'],
['ethics','💗','الأخلاق والقيم','c4'],
['occasions','🌙','المناسبات الإسلامية','c2'],
['competitions','🏆','المسابقات والتحديات','c2'],
['library','📚','المكتبة الإسلامية','c4'],
['ask','❓','اسأل عن الأنبياء','c1'],
['achievements','🏅','إنجازات الطفل','c2'],
['search','🔎','البحث','c5'],
['favorites','❤️','المفضلة','c4'],
['info','📜','معلومات مفيدة','c3'],
['stories','📖','قصص وعبر من القرآن','c6'],
['reports','📊','التقارير','c1'],
['certificates','🎖️','الشهادات','c3'],
['about','ℹ️','عن التطبيق','c5']
];
const prophets=['آدم','إدريس','نوح','هود','صالح','إبراهيم','لوط','إسماعيل','إسحاق','يعقوب','يوسف','أيوب','شعيب','موسى','هارون','ذو الكفل','داود','سليمان','إلياس','اليسع','يونس','زكريا','يحيى','عيسى','محمد ﷺ'];
const stories=[
['أصحاب الكهف','قصة الفتية الذين آمنوا بالله وثبتوا على إيمانهم.'],
['موسى والخضر','رحلة موسى عليه السلام في طلب العلم والتعلم من الحكمة.'],
['ذو القرنين','رحلات ذي القرنين ومواقفه في العدل ومساعدة الناس.'],
['أصحاب الفيل','كيف حفظ الله بيته الحرام من جيش الفيل.'],
['قارون','قصة الغرور بالمال وعاقبة الكبر.']
];
let child='eyad';
const keys={eyad:'athar_eyad',mayan:'athar_mayan',layan:'athar_layan'};
const names={eyad:'إياد',mayan:'مايان',layan:'ليان'};
const faces={eyad:'👦',mayan:'👧',layan:'👶'};
function getData(){try{return JSON.parse(localStorage.getItem(keys[child]))||{stars:0,done:[],favorites:[],last:''}}catch(e){return {stars:0,done:[],favorites:[],last:''}}}
function saveData(d){localStorage.setItem(keys[child],JSON.stringify(d));updateStats()}
function chooseChild(id){child=id;updateStats();goHome()}
function updateStats(){
 let d=getData(),s=d.stars||0,n=d.done.length;
 document.getElementById('childName').textContent=names[child];
 document.getElementById('avatar').textContent=faces[child];
 document.getElementById('stars').textContent=s.toLocaleString('ar-EG');
 document.getElementById('statStars').textContent=s.toLocaleString('ar-EG');
 document.getElementById('achievements').textContent=n;
 document.getElementById('percent').textContent=Math.min(100,n*5)+'%';
 document.getElementById('progressBar').style.width=Math.min(100,n*5)+'%';
 document.getElementById('level').textContent=s>=500?'المستوى الذهبي':s>=100?'المستوى الفضي':'المستوى البرونزي';
 document.getElementById('lastLesson').textContent=d.last||'لم تبدأ التعلم بعد';
}
function renderGrid(){
 document.getElementById('mainGrid').innerHTML=sections.map(x=>`<button class="tile ${x[3]}" onclick="openSection('${x[0]}')"><span class="emoji">${x[1]}</span><span>${x[2]}</span></button>`).join('');
}
function goHome(){document.getElementById('homeLayout').style.display='grid';document.querySelector('.challenge').style.display='block';document.getElementById('contentPage').classList.remove('active')}
function openLastLesson(){let d=getData();openSection(d.lastId||'prophets')}
function openSection(id){
 document.getElementById('homeLayout').style.display='none';
 document.querySelector('.challenge').style.display='none';
 let p=document.getElementById('contentPage');p.classList.add('active');
 let title=sections.find(x=>x[0]===id)?.[2]||'القسم';
 let html=`<h2>${title}</h2>`;
 if(id==='prophets'){
 html+=`<div class="notice">تضم الموسوعة الأنبياء الخمسة والعشرين. اختر نبيًا لفتح ملفه التعليمي. المعلومات التفصيلية والآيات والمراجع والمشاهد تُستكمل وتُراجع قبل اعتمادها.</div><div class="items">`;
 prophets.forEach((n,i)=>html+=`<div class="item">🌟<br>${n}<br><button onclick="prophet('${n}',${i})">فتح الملف</button></div>`);
 html+='</div>';
 }else if(id==='stories'){
 html+='<div class="items">'+stories.map((s,i)=>`<div class="item">📖<br>${s[0]}<br><button onclick="story(${i})">اقرأ القصة</button></div>`).join('')+'</div>';
 }else if(id==='search'){
 html+=`<input class="search" id="searchInput" placeholder="ابحث في أقسام التطبيق..." oninput="doSearch(this.value)"><div id="searchResults"></div>`;
 }else if(id==='favorites'){
 let fav=getData().favorites;html+=fav.length?'<div class="items">'+fav.map(x=>`<div class="item">${x}</div>`).join('')+'</div>':'<p>لم تضف عناصر للمفضلة بعد.</p>';
 }else if(id==='prayer'){
 html+=`<h3>الصلوات الخمس</h3><div class="items">${[['الفجر','ركعتان'],['الظهر','أربع ركعات'],['العصر','أربع ركعات'],['المغرب','ثلاث ركعات'],['العشاء','أربع ركعات']].map(x=>`<div class="item">🕌<b>${x[0]}</b><br>${x[1]}</div>`).join('')}</div><h3>تعلم الوضوء</h3><p>النية، التسمية، غسل الكفين، المضمضة والاستنشاق، غسل الوجه، غسل اليدين إلى المرفقين، مسح الرأس والأذنين، غسل القدمين إلى الكعبين، مع مراعاة الترتيب والموالاة.</p><p>سنعرض لاحقًا كل خطوة بصورة تعليمية وتفاصيلها.</p>`;
 }else if(id==='pillars'){
 let a=['الشهادتان','إقامة الصلاة','إيتاء الزكاة','صوم رمضان','حج البيت لمن استطاع إليه سبيلًا'];
 html+='<div class="items">'+a.map((x,i)=>`<div class="item">${['☝️','🕌','🤲','🌙','🕋'][i]}<br>${i+1}. ${x}</div>`).join('')+'</div>';
 }else if(id==='names'){
 html+='<p>أسماء الله الحسنى، نتعلمها ونفهم معانيها بما يناسب أعمار الأطفال.</p><div class="notice">سيتم إدراج الأسماء التسعة والتسعين وشرح كل اسم مع مراجعة ثبوت الأسماء ومصادرها.</div>';
 }else if(id==='quran'){
 html+='<p>المصحف مقسم إلى ثلاثين جزءًا، مع معاني الكلمات الصعبة وتفسير مبسط موثق.</p><div class="items">'+Array.from({length:30},(_,i)=>`<div class="item">📖 الجزء ${i+1}</div>`).join('')+'</div>';
 }else if(id==='ask'||id==='competitions'){
 html+=`<div class="notice">اختبر معلوماتك!</div><h3>من النبي الذي ابتلعه الحوت؟</h3><div class="items">${['موسى عليه السلام','يونس عليه السلام','يوسف عليه السلام'].map(x=>`<button class="item" onclick="answer('${x}')">${x}</button>`).join('')}</div>`;
 }else if(id==='achievements'||id==='reports'||id==='certificates'){
 let d=getData();html+=`<div class="notice">إنجازات ${names[child]}</div><h3>⭐ النجوم: ${d.stars}</h3><h3>📚 الدروس المكتملة: ${d.done.length}</h3><p>كلما أكملت درسًا تحصل على نجوم وتقترب من إنجاز جديد.</p>`;
 }else if(id==='about'){
 html+='<p><b>أثر الأنبياء – موسوعة إسلامية تعليمية للأطفال.</b></p><p>تطبيق تعليمي يهدف إلى تقريب القصص والمعارف الإسلامية للأطفال بأسلوب مبسط وممتع، وغرس الإيمان والأخلاق والقيم.</p><p>إعداد وتصميم: صاحب فكرة التطبيق.</p>';
 }else{
 html+=`<div class="notice">هذا القسم جزء من موسوعة أثر الأنبياء. سيُجهز بمحتواه التفصيلي وأنشطته ومراجعه، وفق خريطة المشروع المتفق عليها.</div>`;
 }
 document.getElementById('pageContent').innerHTML=html;
 let d=getData();d.last=title;d.lastId=id;saveData(d);
}
function prophet(n,i){
 let d=getData();d.last='ملف النبي '+n;d.lastId='prophets';saveData(d);
 document.getElementById('pageContent').innerHTML=`<button class="back" onclick="openSection('prophets')">↩ قائمة الأنبياء</button><h2>النبي ${n} عليه السلام</h2><div class="notice">ملف تعريفي: السيرة الذاتية، مواضع ذكره في القرآن، الأسرة حيث ثبتت، المعجزات والآيات، والمراجع.</div><h3>قصة النبي ${n}</h3><p>سيتم إعداد القصة في مشاهد متتابعة غير مختصرة، من 6 إلى 15 مشهدًا أو أكثر حسب طول السيرة، بلغة تناسب الطفل.</p><h3>المشاهد التعليمية</h3><div class="items">${Array.from({length:6},(_,j)=>`<div class="item">🎬 المشهد ${j+1}<p>تفاصيل القصة والآيات والدروس المستفادة.</p></div>`).join('')}</div><h3>الحكمة المستفادة</h3><p>نتعلم من قصص الأنبياء الإيمان بالله والصبر والصدق والثبات على الحق.</p><button class="action" onclick="complete('قصة النبي ${n}')">أنهيت الدرس ⭐</button><button class="action" onclick="favorite('النبي ${n}')">أضف للمفضلة ❤️</button>`;
}
function story(i){
 let s=stories[i];document.getElementById('pageContent').innerHTML=`<button class="back" onclick="openSection('stories')">↩ القصص</button><h2>${s[0]}</h2><p>${s[1]}</p><div class="notice">تُجهز القصة كاملة بالمشاهد والآيات والدروس والمصادر قبل اعتمادها.</div><button class="action" onclick="complete('${s[0]}')">أنهيت القصة ⭐</button>`;
}
function complete(name){let d=getData();if(!d.done.includes(name)){d.done.push(name);d.stars+=10}saveData(d);alert('أحسنت! حصلت على 10 نجوم ⭐');}
function favorite(name){let d=getData();if(!d.favorites.includes(name))d.favorites.push(name);saveData(d);alert('تمت الإضافة للمفضلة ❤️')}
function answer(x){if(x==='يونس عليه السلام'){complete('تحدي الأنبياء');alert('إجابة صحيحة! أحسنت ⭐')}else alert('حاول مرة أخرى، بالتوفيق!')}
function doSearch(q){let r=document.getElementById('searchResults');if(!q.trim()){r.innerHTML='';return}let found=sections.filter(x=>x[2].includes(q));let ps=prophets.filter(x=>x.includes(q));r.innerHTML='<div class="items">'+found.map(x=>`<button class="item" onclick="openSection('${x[0]}')">${x[2]}</button>`).join('')+ps.map(x=>`<button class="item" onclick="openSection('prophets');setTimeout(()=>prophet('${x}',0),50)">النبي ${x}</button>`).join('')+'</div>'}
renderGrid();updateStats();
</script>
</body>
</html>
