const childNames={eyad:['إياد','👦'],mayan:['مايان','👧'],layan:['ليان','👶']};let current='eyad',state={},currentSection='';

function homeShow(){currentSection='';home.style.display='block';view.style.display='none';scrollTo(0,0)}
function grid(){mainGrid.innerHTML=sections.map(s=>`<button class="tile ${s[3]}" onclick="openSection('${s[0]}')"><span class="ico">${s[2]}</span>${s[1]}</button>`).join('')}
function openSection(id){currentSection=id;home.style.display='none';view.style.display='block';let s=sections.find(x=>x[0]===id);view.innerHTML=`<button class="btn" onclick="homeShow()">⬅ الرئيسية</button><div class="section"><h2>${s[2]} ${s[1]}</h2><div id="content"></div></div>`;render(id);scrollTo(0,0)}
function box(t,b,buttons=''){return `<article class="card"><h3>${t}</h3>${b}<div>${buttons}</div></article>`}
function doneBtn(k,t){return `<button class="btn alt" onclick="complete('${k}','${t}')">أنهيت الدرس ⭐</button>`}
function favBtn(k){return `<button class="btn light" onclick="favorite('${k}')">${state.favorites.includes(k)?'❤️ محفوظ':'♡ أضف للمفضلة'}</button>`}
function render(id){let c=document.getElementById('content'),o='';
if(id==='prophets')o=box('الأنبياء الخمسة والعشرون','<p>افتح اسم النبي لعرض نبذة ومشاهد تعليمية. لا تُذكر تفاصيل الأسرة إلا بدليل ثابت.</p>')+prophets.map((p,i)=>`<button class="btn light" onclick="prophet(${i})">${i+1}. ${p[0]}</button>`).join('');

else if(id==='values')o=values.map((x,i)=>box(x[0],x[1],doneBtn('v'+i,x[0])+favBtn('v'+i))).join('');

else if(id==='seerah')o=['المولد والنشأة في مكة','الشباب والصدق والأمانة','نزول الوحي في غار حراء','الدعوة السرية والجهرية','الهجرة إلى المدينة','بناء المسجد والمؤاخاة','غزوة بدر','غزوة أحد','غزوة الخندق','صلح الحديبية','فتح مكة','حجة الوداع والوفاة'].map((x,i)=>box((i+1)+'. '+x,'محطة من السيرة النبوية، تُستكمل تفاصيلها مع توثيق الروايات من مصادر السيرة المعتمدة.',doneBtn('s'+i,x))).join('');
else if(id==='journeys')o=['هجرة إبراهيم عليه السلام','رحلة موسى إلى مدين','خروج موسى ببني إسرائيل','هجرة النبي ﷺ إلى المدينة','الإسراء والمعراج'].map((x,i)=>box(x,'نتعرف على الرحلة وما ثبت من أحداثها والدروس المستفادة.',doneBtn('r'+i,x))).join('');
else if(id==='family')o=box('روابط النسب الثابتة','<ul><li>إبراهيم: من ذريته إسماعيل وإسحاق.</li><li>إسحاق: من ذريته يعقوب.</li><li>يعقوب: هو إسرائيل، ومن أبنائه يوسف وإخوته.</li><li>داود: ابنه سليمان.</li><li>موسى وهارون أخوان.</li><li>زكريا: ابنه يحيى.</li><li>عيسى ابن مريم وليس له أب.</li></ul>');
else if(id==='occasions')o=['رمضان','عيد الفطر','عيد الأضحى','الحج ويوم عرفة','الهجرة النبوية','يوم الجمعة'].map((x,i)=>box(x,'تعرف على المناسبة ومعناها وأعمال المسلم فيها.',doneBtn('o'+i,x))).join('');
else if(id==='info')o=['الصلوات المفروضة خمس.','قبلة المسلمين الكعبة المشرفة.','كتاب المسلمين القرآن الكريم.','يصوم المسلمون شهر رمضان.','من أسماء المدينة: المدينة المنورة.'].map((x,i)=>box('معلومة '+(i+1),x)).join('');
else if(id==='qstories')o=['أصحاب الكهف','ذو القرنين','موسى والخضر','أصحاب الجنة','قارون','أصحاب الفيل','مؤمن آل فرعون'].map((x,i)=>box(x,'قصة قرآنية نتدبر آياتها ونفصل بين نص القرآن وما قد يرد من أخبار لا تثبت.',doneBtn('q'+i,x))).join('');
else if(id==='quiz')o=box('سؤال: من النبي الذي التقمه الحوت؟','<button class="btn light" onclick="quiz(this,false)">موسى</button><button class="btn light" onclick="quiz(this,true)">يونس</button><button class="btn light" onclick="quiz(this,false)">يوسف</button><p class="feedback"></p>')+box('سؤال: كم عدد أركان الإسلام؟','<button class="btn light" onclick="quiz(this,false)">ثلاثة</button><button class="btn light" onclick="quiz(this,true)">خمسة</button><button class="btn light" onclick="quiz(this,false)">سبعة</button><p class="feedback"></p>');
else if(id==='achievements'||id==='certificates')o=box('إنجازات '+childNames[current][0],`<p>النجوم: ${state.stars}</p><p>الدروس المكتملة: ${state.done.length}</p><p>الشارات: ${state.badges.join('، ')||'لا توجد بعد'}</p><button class="btn gold" onclick="window.print()">طباعة شهادة الإنجاز</button>`);
else if(id==='reports')o=box('تقرير التقدم',`<p>الطفل: ${childNames[current][0]}</p><p>النجوم: ${state.stars}</p><p>الدروس المكتملة: ${state.done.length}</p><p>آخر درس: ${state.last||'لم يبدأ بعد'}</p><p>البيانات محفوظة على هذا الجهاز.</p>`);
else if(id==='favorites')o=box('المفضلة',state.favorites.length?state.favorites.map(x=>'<p>'+x+'</p>').join(''):'لم تضف عناصر بعد.');
else if(id==='ask')o=box('اسأل عن الأنبياء','<input class="search" id="askInput" placeholder="مثال: من صنع السفينة؟"><button class="btn" onclick="ask()">اعرض الإجابة</button><div id="answer"></div>');
else if(id==='search')o=box('البحث في الموسوعة','<input class="search" oninput="searchContent(this.value)" placeholder="اكتب كلمة للبحث"><div id="results"></div>');

function prophet(i){let p=prophets[i];let body=`<h2>النبي ${p[0]} عليه السلام</h2><p>${p[1]}</p><h3>الملف التعريفي</h3><p>تُذكر معلومات الأسرة والنسب والمعجزات فقط عند ثبوتها بدليل معتبر.</p><h3>مشاهد من القصة</h3>${p[2].map((x,j)=>`<div class="scene"><b>المشهد ${j+1}:</b> ${x}<p>العبرة: نتعلم الإيمان والصبر وطاعة الله.</p></div>`).join('')}<h3>الحكمة المستفادة</h3><p>الثبات على التوحيد والصدق والصبر والتوكل على الله.</p><p class="muted">يلزم إلحاق أرقام الآيات والسور والتخريج التفصيلي والمراجعة العلمية قبل النشر.</p>${doneBtn('p'+i,'قصة '+p[0])}${favBtn('p'+i)}`;modalBody.innerHTML=body;modal.classList.add('show');state.last='قصة '+p[0];save()}
function closeModal(){modal.classList.remove('show')}
function complete(k,t){if(!state.done.includes(k)){state.done.push(k);state.stars+=2;if(state.done.length===1)state.badges.push('البداية');if(state.done.length===10)state.badges.push('محب العلم')}state.last=t;save();if(currentSection)render(currentSection)}
function favorite(k){let i=state.favorites.indexOf(k);i<0?state.favorites.push(k):state.favorites.splice(i,1);save();if(currentSection)render(currentSection)}
function dailyDone(){complete('daily-'+new Date().toDateString(),'تحدي اليوم');alert('أحسنت! ⭐')}
function quiz(btn,ok){let f=btn.parentElement.querySelector('.feedback');f.textContent=ok?'إجابة صحيحة، أحسنت! ⭐':'حاول مرة أخرى.';if(ok)complete('quiz-'+btn.parentElement.textContent.slice(0,20),'المسابقة')}
function ask(){let q=askInput.value,a='لم أجد إجابة واضحة في المحتوى الحالي.';if(/سفين|فلك/.test(q))a='النبي نوح عليه السلام صنع الفلك بأمر الله.';else if(/حوت/.test(q))a='النبي يونس عليه السلام.';else if(/نار/.test(q))a='النبي إبراهيم عليه السلام، وجعل الله النار عليه بردًا وسلامًا.';else if(/فرعون|كليم/.test(q))a='النبي موسى عليه السلام.';else if(/خاتم/.test(q))a='محمد ﷺ خاتم الأنبياء والمرسلين.';answer.textContent=a}
function searchAll(q){let old=document.getElementById('quick');if(old)old.remove();if(!q.trim())return;let hits=prophets.map((p,i)=>p.join(' ').includes(q)?`<button class="btn light" onclick="openSection('prophets');setTimeout(()=>prophet(${i}),50)">${p[0]}</button>`:'').join('');let d=document.createElement('div');d.id='quick';d.className='card';d.innerHTML=hits||'لا توجد نتائج في أسماء الأنبياء.';globalSearch.after(d)}
function searchContent(q){results.innerHTML=prophets.filter(p=>p.join(' ').includes(q)).map(p=>'<p><b>'+p[0]+'</b>: '+p[1]+'</p>').join('')||'لا توجد نتائج.'}
const tasks=['قل بسم الله قبل الطعام.','ساعد أحد أفراد أسرتك.','اقرأ آية من القرآن.','قل الحمد لله ثلاث مرات.','احكِ خلقًا جميلًا تعلمته.','حافظ على صلاتك في وقتها.'];
dailyText.textContent=tasks[new Date().getDate()%tasks.length];grid();load();paint();
</script></body></html>
