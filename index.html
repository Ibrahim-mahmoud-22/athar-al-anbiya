
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>أثر الأنبياء | موسوعة الطفل المسلم</title>
<style>
:root{
 --purple:#7058dc;--pink:#ff79ae;--blue:#55b9ed;
 --yellow:#ffd45f;--green:#61c99a;--orange:#ff9c65;
 --ink:#302b50;--muted:#77748d;--paper:#fff;
 --bg:#f6f4ff;--line:#eeeafa;
}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--ink);
 font-family:Tahoma,Arial,sans-serif;line-height:1.8;
}
button,input{font:inherit}
button{cursor:pointer}
header{
 background:linear-gradient(125deg,#6757d9,#a56de7 55%,#f28ab6);
 color:white;padding:24px 18px 30px;border-radius:0 0 30px 30px;
}
.top{max-width:1050px;margin:auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{
 width:55px;height:55px;border-radius:19px;background:#ffffff35;
 display:grid;place-items:center;font-size:30px;
}
h1{font-size:25px;margin:0}
header p{margin:3px 0;opacity:.9}
.profile-row{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:20px}
.profile-row select{
 border:0;border-radius:13px;padding:10px 14px;background:white;color:var(--ink);
}
.stats{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.stat{
 background:#ffffff24;border:1px solid #ffffff35;
 border-radius:13px;padding:7px 13px;font-size:14px;
}
main{max-width:1050px;margin:20px auto;padding:0 14px 40px}
.searchbox{display:flex;gap:8px;margin-bottom:15px}
.searchbox input{
 flex:1;min-width:0;border:1px solid var(--line);border-radius:15px;
 padding:13px;background:white;outline:none;
}
.nav{
 display:flex;gap:8px;overflow-x:auto;padding:5px 0 14px;
 scrollbar-width:thin;
}
.nav button{
 flex:none;border:1px solid var(--line);background:white;
 color:var(--ink);padding:9px 15px;border-radius:14px;
}
.nav button.active{background:var(--purple);color:white;border-color:var(--purple)}
.panel{
 background:white;border-radius:22px;padding:19px;margin-bottom:15px;
 box-shadow:0 5px 22px #42338a0a;
}
.hero{
 background:linear-gradient(120deg,#fff0f6,#f0efff);
 border-radius:20px;padding:20px;margin-bottom:16px;
}
.hero h2{margin:0 0 5px;font-size:22px}
.section-title{font-size:21px;margin:0 0 14px}
.grid{
 display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:11px;
}
.item{
 border:1px solid var(--line);border-radius:17px;padding:13px;
 background:#fff;text-align:right;color:var(--ink);width:100%;
 transition:.15s;
}
.item:active{transform:scale(.98)}
.item .emoji{font-size:27px;display:block}
.item strong{display:block;font-size:15px}
.item small{color:var(--muted);font-size:12px}
.item.pink{background:#fff1f7}
.item.blue{background:#eef9ff}
.item.green{background:#effbf5}
.item.yellow{background:#fff9e9}
.item.purple{background:#f3f0ff}
.item.orange{background:#fff3eb}
.btn{
 border:0;background:var(--purple);color:white;padding:10px 16px;
 border-radius:13px;font-weight:bold;
}
.btn.light{background:#f0edff;color:var(--purple)}
.btn.pink{background:#ffedf5;color:#d84e8a}
.btn.green{background:#e9fbf1;color:#23885b}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}
.detail-title{font-size:23px;margin:0}
.muted{color:var(--muted);font-size:13px}
.info{
 background:#f5f3ff;border-radius:15px;padding:13px;margin:12px 0;
}
.story{
 border-right:4px solid var(--pink);padding:10px 13px;
 margin:10px 0;background:#fff8fb;border-radius:12px;
}
.story h4{margin:0 0 5px}
.tag{
 display:inline-block;background:#f1efff;color:#6652c7;
 border-radius:30px;padding:3px 10px;font-size:12px;margin:3px;
}
ul.clean{padding-right:21px}
ul.clean li{margin:6px 0}
.progressbar{height:10px;background:#eeeaf8;border-radius:20px;overflow:hidden}
.progressbar span{display:block;height:100%;background:var(--green);width:0}
.quiz-option{
 display:block;width:100%;text-align:right;padding:12px;
 border:1px solid var(--line);border-radius:13px;background:white;
 margin:8px 0;color:var(--ink);
}
.quiz-option.correct{background:#e8f9ef;border-color:#61c99a}
.quiz-option.wrong{background:#fff0f0;border-color:#ed8585}
footer{text-align:center;color:var(--muted);padding:25px 10px;font-size:12px}
.hidden{display:none!important}
hr{border:0;border-top:1px solid var(--line);margin:16px 0}
@media(min-width:700px){
 header{padding:30px}
 .hero{padding:27px}
 .panel{padding:24px}
}
</style>
</head>

  <button onclick="showPage('favorites',this)">❤️ المفضلة</button>

 </nav>

 <section id="content"></section>
</main>

{id:12,n:"أيوب عليه السلام",title:"نبي الصبر",people:"لم يحدد القرآن قومه",place:"غير محدد قطعًا",intro:"ابتلى الله أيوب في جسده وأهله وماله، فصبر ودعا ربه بأدب، فكشف الله ضره.",miracle:"شفاؤه بعد دعائه، وتفجير الماء له ليغتسل ويشرب.",lesson:"الصبر وعدم اليأس من رحمة الله.",refs:"الأنبياء 83-84، ص 41-44",scenes:[
["الابتلاء","ابتلى الله أيوب في صحته وأهله وماله."],
["الصبر","لم ينس أيوب ربه، ولم ييأس من رحمته."],
["الدعاء","دعا ربه أن مسه الضر وأن الله أرحم الراحمين."],
["الشفاء","أمره الله أن يضرب برجله الأرض، فنبعت عين ماء."],
["الفرج","كشف الله ضره وآتاه أهله ومثلهم معهم رحمة منه."]
]},
{id:13,n:"شعيب عليه السلام",title:"نبي مدين",people:"مدين وأصحاب الأيكة",place:"مدين",intro:"دعا شعيب قومه إلى التوحيد وإيفاء الكيل والميزان وعدم بخس الناس حقوقهم.",miracle:"نجاة المؤمنين وإهلاك المكذبين بأمر الله.",lesson:"الأمانة والعدل في البيع والشراء.",refs:"الأعراف 85-93، هود 84-95، الشعراء 176-191",scenes:[
["فساد المعاملات","كان قومه ينقصون المكيال والميزان ويظلمون الناس."],
["دعوة شعيب","أمرهم بعبادة الله وإتمام الكيل والميزان."],
["السخرية","قابل بعضهم دعوته بالسخرية والتهديد."],
["الإنذار","حذرهم من عاقبة الفساد والتكذيب."],
["النجاة","نجى الله شعيبًا والذين آمنوا معه وأخذ المكذبين."]
]},
{id:14,n:"موسى عليه السلام",title:"كليم الله ومن أولي العزم",people:"فرعون وبنو إسرائيل",place:"مصر ومدين وسيناء",intro:"أرسل الله موسى إلى فرعون، وأيده بالآيات، وأنقذ به بني إسرائيل من الظلم.",miracle:"العصا واليد البيضاء وانفلاق البحر بإذن الله.",lesson:"الشجاعة في الحق والثقة بالله.",refs:"طه، القصص، الأعراف 103-137، الشعراء 10-68",scenes:[
["الولادة","ولد موسى في زمن كان فرعون يقتل أبناء بني إسرائيل، فأوحى الله إلى أمه أن تلقيه في اليم."],
["قصر فرعون","التقطه آل فرعون، وردّه الله إلى أمه لترضعه."],
["مدين","خرج موسى من مصر ووصل إلى مدين وساعد امرأتين عند الماء."],
["الرسالة","كلمه الله عند الطور وأرسله إلى فرعون، وأيده بالعصا واليد."],
["مواجهة السحرة","ألقى السحرة حبالهم، فألقى موسى عصاه فابتلعت ما صنعوا، فآمن السحرة."],
["الخروج","خرج موسى ببني إسرائيل، ولحق بهم فرعون وجنوده."],
["انفلاق البحر","ضرب موسى البحر بعصاه فانفلق، ونجا المؤمنون وغرق فرعون."],
["الألواح","آتاه الله الألواح، وابتلي قومه بعبادة العجل في غيابه."]
]},
{id:15,n:"هارون عليه السلام",title:"أخو موسى ووزيره",people:"بنو إسرائيل",place:"مصر وسيناء",intro:"هارون أخو موسى عليهما السلام، دعا معه فرعون إلى عبادة الله، وكان فصيح اللسان.",miracle:"أيده الله بالنبوة وساند أخاه موسى.",lesson:"التعاون على الخير والحكمة.",refs:"طه 29-36، الأعراف 142-150، مريم 53",scenes:[
["الدعاء","طلب موسى من الله أن يجعل هارون أخاه وزيرًا له."],
["الرسالة","ذهب هارون مع موسى إلى فرعون يدعوانه إلى الله."],
["مساندة موسى","كان هارون عونًا لأخيه في الدعوة."],
["فتنة العجل","حاول هارون منع بني إسرائيل من عبادة العجل أثناء غياب موسى."]
]},
{id:16,n:"ذو الكفل عليه السلام",title:"من الصابرين والأخيار",people:"لم يحدد القرآن قومه",place:"غير محدد",intro:"ذكره الله في القرآن مع إسماعيل وإدريس، ووصفهم بالصبر والصلاح.",miracle:"لم تذكر له معجزة محددة في القرآن.",lesson:"الصبر والثبات على الطاعة.",refs:"الأنبياء 85-86، ص 48",scenes:[
["الذكر في القرآن","ذكره الله مع الأنبياء الصابرين."],
["الصلاح","وصفه الله بأنه من الأخيار."],
["الصبر","جعله الله من أهل الصبر والرحمة."]
]},
{id:17,n:"داود عليه السلام",title:"النبي الملك",people:"بنو إسرائيل",place:"بيت المقدس",intro:"آتاه الله الملك والحكمة والنبوة، وأنزل عليه الزبور، وسخر معه الجبال والطير تسبح.",miracle:"إلانة الحديد، وتسبيح الجبال والطير معه.",lesson:"العدل والعبادة وشكر النعمة.",refs:"ص 17-26، سبأ 10-11، الأنبياء 78-80",scenes:[
["طالوت وجالوت","كان داود في جيش طالوت، وقتل جالوت بإذن الله."],
["الملك والنبوة","آتاه الله الملك والحكمة والنبوة."],
["الزبور","أنزل الله عليه الزبور."],
["تسبيح الجبال","سخر الله الجبال والطير يسبحن معه."],
["الحديد","ألان الله له الحديد وعلمه صناعة الدروع."],
["العدل","أمره الله أن يحكم بين الناس بالحق ولا يتبع الهوى."]
]},
{id:18,n:"سليمان عليه السلام",title:"النبي الملك",people:"بنو إسرائيل",place:"بيت المقدس ومملكة سليمان",intro:"سليمان ابن داود عليهما السلام، آتاه الله ملكًا عظيمًا، وعلمه منطق الطير وسخر له الريح والجن.",miracle:"فهم منطق الطير وتسخير الريح والجن بإذن الله.",lesson:"الشكر والتواضع وعدم الاغترار بالقوة.",refs:"النمل 15-44، سبأ 12-14، الأنبياء 81-82، ص 30-40",scenes:[
["وراثة العلم","ورث سليمان داود في النبوة والعلم والملك."],
["فهم النمل","سمع نملة تحذر قومها فتبسم شاكرًا نعمة الله."],
["الهدهد","تفقد الطير، وعرف من الهدهد خبر ملكة سبأ وقومها."],
["ملكة سبأ","أرسل إليها كتابًا يدعوها إلى الإسلام، فجاءت وفهمت الحق."],
["عرش بلقيس","جيء بعرشها قبل وصولها بأمر الله."],
["الشكر","قال سليمان إن هذا من فضل ربي ليبلوني أأشكر أم أكفر."],
["الوفاة","مات سليمان متكئًا على عصاه، ولم تعرف الجن بموته إلا بعد أن أكلت دابة الأرض عصاه."]
]},
{id:19,n:"إلياس عليه السلام",title:"نبي من الصالحين",people:"قوم عبدوا صنم بعل",place:"بلاد الشام على وجه الإجمال",intro:"دعا إلياس قومه إلى عبادة الله وحده وترك عبادة بعل.",miracle:"لم يفصل القرآن معجزة محددة له.",lesson:"الإخلاص في عبادة الله.",refs:"الصافات 123-132، الأنعام 85",scenes:[
["الدعوة","أرسل الله إلياس إلى قومه."],
["إنكار الشرك","سألهم أتدعون بعلًا وتتركون أحسن الخالقين؟"],
["التذكير","دعاهم إلى تقوى الله وعبادته."],
["الجزاء","ذكره الله بالسلام وأنه من عباده المؤمنين."]
]},
{id:20,n:"اليسع عليه السلام",title:"نبي من الأخيار",people:"لم يحدد القرآن قومه",place:"غير محدد قطعًا",intro:"ذكر الله اليسع في القرآن مع عدد من الأنبياء، وأثنى عليه بأنه من الأخيار.",miracle:"لم تذكر له معجزة محددة في القرآن.",lesson:"الاستقامة والعمل الصالح.",refs:"الأنعام 86، ص 48",scenes:[
["الذكر","ذكره الله في جملة الأنبياء."],
["الاختيار","وصفه الله بأنه من الأخيار."],
["الصلاح","كان من عباد الله الذين اصطفاهم."]
]},
{id:21,n:"يونس عليه السلام",title:"ذو النون",people:"قوم يونس",place:"نينوى على المشهور",intro:"دعا يونس قومه، ثم خرج مغاضبًا قبل أن يؤذن له، فابتلعه الحوت، فدعا الله في الظلمات فنجاه.",miracle:"نجاته من بطن الحوت برحمة الله.",lesson:"الرجوع إلى الله وعدم اليأس.",refs:"الأنبياء 87-88، الصافات 139-148، سورة يونس 98",scenes:[
["الدعوة","دعا يونس قومه إلى الإيمان."],
["الخروج","خرج مغاضبًا قبل أن يؤذن له."],
["السفينة","ركب سفينة فكانت من المدحضين في القرعة."],
["الحوت","التقمه الحوت وهو مليم."],
["الدعاء","دعا في الظلمات: لا إله إلا أنت سبحانك إني كنت من الظالمين."],
["النجاة","استجاب الله له، فنبذه الحوت بالعراء وهو سقيم."],
["إيمان القوم","آمن قوم يونس فنفعهم إيمانهم وكشف الله عنهم العذاب."]
]},
{id:22,n:"زكريا عليه السلام",title:"نبي دعا ربه",people:"بنو إسرائيل",place:"بيت المقدس",intro:"كان زكريا نبيًا صالحًا، دعا ربه أن يرزقه ولدًا يرث النبوة والعلم، فبشره الله بيحيى.",miracle:"رزقه الله يحيى على كبر سنه وكانت زوجته عاقرًا.",lesson:"الدعاء وحسن الظن بالله.",refs:"آل عمران 37-41، مريم 2-15، الأنبياء 89-90",scenes:[
["كفالة مريم","كان زكريا كافلًا لمريم عليها السلام."],
["الدعاء","دعا ربه أن يرزقه ذرية طيبة."],
["البشارة","بشرته الملائكة بيحيى."],
["الآية","جعل الله له علامة ألا يكلم الناس ثلاثة أيام إلا رمزًا."],
["الاستجابة","رزقه الله يحيى رحمة منه."]
]},
{id:23,n:"يحيى عليه السلام",title:"نبي تقي",people:"بنو إسرائيل",place:"بيت المقدس",intro:"يحيى ابن زكريا عليهما السلام، آتاه الله الحكم صبيًا، وكان بارًا بوالديه تقيًا.",miracle:"آتاه الله الحكم صبيًا وجعله سيدًا وحصورًا ونبيًا من الصالحين.",lesson:"الطهارة والبر والتواضع.",refs:"آل عمران 39، مريم 12-15، الأنبياء 90",scenes:[
["البشارة","بشر الله زكريا بغلام اسمه يحيى."],
["الحكمة","آتاه الله الحكم صبيًا."],
["الصفات","كان حنانًا وزكاة وتقيًا وبارًا بوالديه."],
["السلام","ذكر الله سلامه عليه يوم ولد ويوم يموت ويوم يبعث حيًا."]
]},
{id:24,n:"عيسى عليه السلام",title:"المسيح ابن مريم",people:"بنو إسرائيل",place:"بيت المقدس وما حوله",intro:"عيسى ابن مريم عبد الله ورسوله، خلقه الله من غير أب، وأيده بالمعجزات، وهو من أولي العزم.",miracle:"تكلم في المهد، وأبرأ الأكمه والأبرص وأحيا الموتى بإذن الله.",lesson:"الرحمة والتواضع والإيمان بالله.",refs:"آل عمران 45-59، مريم 16-36، المائدة 110-120",scenes:[
["البشارة","بشرت الملائكة مريم بعيسى كلمة من الله."],
["الميلاد","حملت مريم بعيسى بأمر الله وولدته في معجزة عظيمة."],
["الكلام في المهد","تكلم عيسى وهو طفل دفاعًا عن أمه وإعلانًا لعبوديته لله."],
["الدعوة","أرسله الله إلى بني إسرائيل مصدقًا للتوراة."],
["المعجزات","كان يبرئ الأكمه والأبرص ويحيي الموتى بإذن الله."],
["المائدة","طلب الحواريون آية، فدعا عيسى ربه، وأنزل الله المائدة."],
["الرفع","أخبر القرآن أن الله رفعه إليه وأن أعداءه لم يقتلوه ولم يصلبوه."]
]},
{id:25,n:"محمد ﷺ",title:"خاتم الأنبياء والمرسلين",people:"العالمين",place:"مكة المكرمة والمدينة المنورة",intro:"محمد ﷺ رسول الله وخاتم النبيين، أرسله الله رحمة للعالمين، وأنزل عليه القرآن الكريم هداية للناس.",miracle:"القرآن الكريم أعظم معجزاته، ومن آياته الإسراء والمعراج وانشقاق القمر.",lesson:"الرحمة والصدق والأمانة والصبر وحسن الخلق.",refs:"الأحزاب 40، الأنبياء 107، الإسراء 1، القمر 1-2",scenes:[
["المولد والنشأة","ولد بمكة عام الفيل على المشهور، ونشأ يتيمًا، وعرف بين قومه بالصدق والأمانة."],
["غار حراء","كان يتعبد في غار حراء، ونزل عليه الوحي بأول آيات سورة العلق."],
["الدعوة السرية","دعا المقربين إلى الإسلام، فآمن به السابقون."],
["الجهر بالدعوة","جهر بدعوة التوحيد وصبر على أذى المشركين."],
["الهجرة","هاجر من مكة إلى المدينة مع أبي بكر رضي الله عنه."],
["بناء المجتمع","آخى بين المهاجرين والأنصار، وبنى المسجد النبوي."],
["بدر وأحد والخندق","واجه المسلمون تحديات كبيرة، وتعلموا الصبر والطاعة والتوكل."],
["صلح الحديبية","عقد النبي صلحًا كان فيه خير كبير للمسلمين."],
["فتح مكة","دخل مكة متواضعًا وعفا عن كثير ممن آذوه."],
["حجة الوداع","علم الناس مناسك الحج ووصاهم بالحقوق والرحمة."],
["الوفاة","توفي ﷺ في المدينة بعد أن بلغ الرسالة وأدى الأمانة."]
]}
];

function storageKey(){return "athar_"+currentChild}
function getData(){
 try{return JSON.parse(localStorage.getItem(storageKey()))||{stars:0,done:[],favorites:[],badges:[]}}
 catch(e){return {stars:0,done:[],favorites:[],badges:[]}}
}
function saveData(d){localStorage.setItem(storageKey(),JSON.stringify(d));updateStats()}
function changeChild(){
 currentChild=document.getElementById("child").value;
 localStorage.setItem("athar_last_child",currentChild);
 updateStats();render();
}
function updateStats(){
 const d=getData();
 document.getElementById("stars").textContent=d.stars||0;
 document.getElementById("done").textContent=d.done.length;
 document.getElementById("badges").textContent=d.badges.length;
 const names={eyad:"إياد",mayan:"مايان",layan:"ليان"};
 document.getElementById("childLabel").textContent="أهلاً يا "+names[currentChild]+"!";
}
function showPage(p,btn){
 page=p;
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 if(btn)btn.classList.add("active");
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}
function complete(id){
 const d=getData();
 if(!d.done.includes(id)){
  d.done.push(id);d.stars+=5;
  if(d.done.length>=5&&!d.badges.includes("المتعلم النشيط"))d.badges.push("المتعلم النشيط");
  if(d.done.length>=15&&!d.badges.includes("بطل المعرفة"))d.badges.push("بطل المعرفة");
  if(d.done.length>=30&&!d.badges.includes("نجم الموسوعة"))d.badges.push("نجم الموسوعة");
  saveData(d);alert("أحسنت! حصلت على 5 نجوم ⭐");
 }else alert("هذا الدرس مكتمل بالفعل! أحسنت ⭐");
 render();
}
function toggleFavorite(id){
 const d=getData();
 if(d.favorites.includes(id))d.favorites=d.favorites.filter(x=>x!==id);
 else d.favorites.push(id);
 saveData(d);render();
}

function quizPage(){
 const q=QUIZ[quizIndex];
 if(!q)return `<div class="panel"><h2>أحسنت! انتهى الاختبار 🎉</h2><p>نتيجتك: ${quizScore} من ${QUIZ.length}</p><button class="btn" onclick="restartQuiz()">إعادة الاختبار</button><button class="btn green" onclick="complete('quiz')">احصل على نجوم الإنجاز</button></div>`;
 return `<div class="panel">
 <h2 class="section-title">🎯 اختبر معلوماتك</h2>
 <p>السؤال ${quizIndex+1} من ${QUIZ.length}</p>
 <div class="progressbar"><span style="width:${(quizIndex/QUIZ.length)*100}%"></span></div>
 <h3>${q[0]}</h3>
 ${q[1].map((o,i)=>`<button class="quiz-option" id="option${i}" onclick="answerQuiz(${i})">${o}</button>`).join("")}
 <div id="feedback"></div>
 <div class="btn-row"><button class="btn" id="nextQuestion" disabled onclick="nextQuiz()">السؤال التالي ←</button></div>
 </div>`;
}
function answerQuiz(i){
 if(quizAnswered)return;quizAnswered=true;
 const q=QUIZ[quizIndex];
 document.querySelectorAll(".quiz-option").forEach((b,j)=>{
  if(j===q[2])b.classList.add("correct");
  else if(j===i)b.classList.add("wrong");
 });
 if(i===q[2])quizScore++;
 document.getElementById("feedback").innerHTML=`<div class="info">${i===q[2]?"🎉 إجابة صحيحة!":"حاول مرة أخرى في المرة القادمة."}<br>${q[3]}</div>`;
 document.getElementById("nextQuestion").disabled=false;
}
function nextQuiz(){
 quizIndex++;quizAnswered=false;
 if(quizIndex>=QUIZ.length){
  const d=getData();d.stars+=quizScore*2;saveData(d);
  document.getElementById("content").innerHTML=quizPage();
 }else render();
}
function restartQuiz(){quizIndex=0;quizScore=0;quizAnswered=false;render()}
function favoritesPage(){
 const d=getData();
 const fav=d.favorites;
 if(!fav.length)return `<div class="panel"><h2>❤️ المفضلة</h2><p>لم تضف أي درس إلى المفضلة بعد. اختر درسًا واضغط إضافة للمفضلة.</p></div>`;
 return `<h2 class="section-title">❤️ دروسي المفضلة</h2>
 <div class="grid">${fav.map(id=>{
  if(id.startsWith("prophet_")){
   const p=PROPHETS.find(x=>x.id===Number(id.split("_")[1]));
   return p?card(p.n,p.title,"🌟",`openProphet(${p.id})`):"";
  }
  return `<div class="item pink"><strong>${id.replaceAll("_"," ")}</strong><button class="btn light" onclick="toggleFavorite('${id}')">إزالة</button></div>`;
 }).join("")}</div>`;
}

 return `<h2 class="section-title">🏆 إنجازاتي</h2>

 <div class="item yellow"><span class="emoji">⭐</span><strong>${d.stars}</strong><small>نجمة</small></div>

 </div>
 <div class="panel"><h3>الدروس المكتملة</h3>
 ${d.done.length?d.done.map(x=>`<span class="tag">✓ ${x.replaceAll("_"," ")}</span>`).join(""):"<p>لم تكمل دروسًا بعد. ابدأ رحلتك الآن!</p>"}

 <div class="panel"><h3>🌱 تقدمك</h3><div class="progressbar"><span style="width:${Math.min(100,d.done.length*3)}%"></span></div>
 <p>${d.done.length} إنجاز حتى الآن. استمر يا بطل!</p></div>`;
}
function searchAll(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 if(!q){if(page==="search")showPage("home");return}
 const matches=PROPHETS.filter(p=>(p.n+" "+p.title+" "+p.intro+" "+p.lesson).toLowerCase().includes(q));
 const names=ALLAH_NAMES.filter(n=>(n[0]+" "+n[1]).toLowerCase().includes(q));
 const values=VALUES.filter(v=>(v[0]+" "+v[1]).toLowerCase().includes(q));
 page="search";
 document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));
 let html=`<h2 class="section-title">🔎 نتائج البحث عن: ${q}</h2>`;
 if(!matches.length&&!names.length&&!values.length)html+="<div class='panel'>لا توجد نتائج مطابقة. جرب كلمة أخرى.</div>";
 if(matches.length)html+=`<h3>الأنبياء</h3><div class="grid">${matches.map(p=>card(p.n,p.title,"🌟",`openProphet(${p.id})`)).join("")}</div>`;
 if(names.length)html+=`<h3>أسماء الله الحسنى</h3><div class="grid">${names.map(n=>`<div class="item purple"><strong>${n[0]}</strong><small>${n[1]}</small></div>`).join("")}</div>`;
 if(values.length)html+=`<h3>الأخلاق</h3><div class="grid">${values.map(v=>`<div class="item pink"><strong>${v[0]}</strong><small>${v[1]}</small></div>`).join("")}</div>`;
 document.getElementById("content").innerHTML=html;
}
function render(){
 updateStats();
 const pages={
 home,prophets:prophetsPage,sirah:sirahPage,names:namesPage,
 prayer:prayerPage,adhkar:adhkarPage,quran:quranPage,
 values:valuesPage,quiz:quizPage,favorites:favoritesPage,progress:progressPage
 };
 document.getElementById("content").innerHTML=(pages[page]||home)();
}
document.getElementById("child").value=localStorage.getItem("athar_last_child")||"eyad";
currentChild=document.getElementById("child").value;
render();
</script>
